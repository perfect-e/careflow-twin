services:
  db:
    image: postgres:15-alpine
    container_name: hosp-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hosp_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d hosp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: hosp-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hosp-backend
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/hosp_db
      OLLAMA_BASE_URL: http://hosp-ollama:11434
      OLLAMA_MODEL: llama3
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      PULL_MODEL_ON_STARTUP: "false"
      CORS_ORIGINS: http://localhost:3001
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hosp-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
